<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stock Inventory Manager</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <style>
    .card-transition { transition: all 0.2s ease-in-out; }
    .card-transition:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
    .search-highlight { background-color: #fef08a; border-radius: 2px; }
    .bento-box { transition: all 0.3s ease; }
    .bento-box:hover { transform: scale(1.02); }
    .modal-backdrop {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background-color: rgba(0,0,0,0.5); z-index: 40; display: flex; align-items: center; justify-content: center;
    }
    .modal-content { position: relative; z-index: 50; }
    .sticky-banner { position: sticky; top: 1rem; z-index: 30; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- Firebase Initialization ---
    const firebaseConfig = {
      apiKey: "AIzaSyDXswzHsLKCTw5z5K4BWYCoolfogybbnvE",
      authDomain: "batal-games.firebaseapp.com",
      projectId: "batal-games",
      storageBucket: "batal-games.appspot.com",
      messagingSenderId: "535042272877",
      appId: "1:535042272877:web:708036abcab58625385964",
      measurementId: "G-7PLD9TE007"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    
    // --- Authentication Logic ---
    const CORRECT_HASH = '60b457b989fe737632616a6142e05621a296d357731f281a8b3074c3e80a7114';

    async function sha256(message) {
        const msgBuffer = new TextEncoder().encode(message);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        return hashHex;
    }

    function LoginScreen({ onLoginSuccess }) {
        const [password, setPassword] = useState('');
        const [error, setError] = useState('');
        const [isVerifying, setIsVerifying] = useState(false);

        const handleLogin = async () => {
            setIsVerifying(true);
            setError('');
            try {
                const inputHash = await sha256(password);
                if (inputHash === CORRECT_HASH) {
                    onLoginSuccess();
                } else {
                    setError('Incorrect password.');
                }
            } catch (e) {
                setError('Could not verify password. Please try again.');
            } finally {
                setIsVerifying(false);
            }
        };

        return (
            <div className="min-h-screen bg-gray-100 flex items-center justify-center p-4">
                <div className="w-full max-w-sm bg-white rounded-lg shadow-md p-8">
                    <h1 className="text-2xl font-bold text-center text-gray-800 mb-6">Inventory Access</h1>
                    <div className="space-y-4">
                        <input
                            type="password"
                            value={password}
                            onChange={(e) => setPassword(e.target.value)}
                            onKeyPress={(e) => e.key === 'Enter' && handleLogin()}
                            placeholder="Enter password"
                            className="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none"
                            autoFocus
                        />
                        <button
                            onClick={handleLogin}
                            disabled={isVerifying}
                            className="w-full px-4 py-2 bg-blue-600 text-white font-bold rounded-md hover:bg-blue-700 disabled:bg-gray-400 flex items-center justify-center"
                        >
                            {isVerifying ? <div className="animate-spin rounded-full h-5 w-5 border-b-2 border-white"></div> : 'Login'}
                        </button>
                        {error && <p className="text-sm text-center text-red-500">{error}</p>}
                    </div>
                </div>
            </div>
        );
    }

    // --- Main Application Component ---
    function StockInventoryApp() {
      // Data States
      const [items, setItems] = useState([]);
      const [packs, setPacks] = useState([]);
      const [ledger, setLedger] = useState([]);

      // UI States
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [editing, setEditing] = useState({ id: null, text: '' });
      const [isLedgerVisible, setIsLedgerVisible] = useState(false);
      const [isSaveSessionModalVisible, setIsSaveSessionModalVisible] = useState(false);
      const [showStartSessionPrompt, setShowStartSessionPrompt] = useState(false);
      
      // Form States
      const [newItemName, setNewItemName] = useState('');
      const [newItemStock, setNewItemStock] = useState('');
      const [showPackForm, setShowPackForm] = useState(false);
      const [newPackName, setNewPackName] = useState('');
      const [packComponents, setPackComponents] = useState([]);
      const [adjustmentItemId, setAdjustmentItemId] = useState(null);
      const [adjustmentPackId, setAdjustmentPackId] = useState(null);
      const [adjustmentValue, setAdjustmentValue] = useState('');

      // Session States
      const [isSessionActive, setIsSessionActive] = useState(false);
      const [sessionChanges, setSessionChanges] = useState([]);
      const [sessionNote, setSessionNote] = useState("");

      // --- Data Fetching ---
      useEffect(() => {
        const unsubItems = db.collection('items').orderBy("createdAt", "desc").onSnapshot(s => setItems(s.docs.map(d => ({ id: d.id, ...d.data() }))), e => setError(`Items Error: ${e.message}`));
        const unsubPacks = db.collection('packs').orderBy("createdAt", "desc").onSnapshot(s => setPacks(s.docs.map(d => ({ id: d.id, ...d.data() }))), e => setError(`Packs Error: ${e.message}`));
        const unsubLedger = db.collection('ledger').orderBy("sessionEndedAt", "desc").onSnapshot(s => setLedger(s.docs.map(d => ({ id: d.id, ...d.data() }))), e => setError(`Ledger Error: ${e.message}`));
        setTimeout(() => setLoading(false), 700);
        return () => { unsubItems(); unsubPacks(); unsubLedger(); };
      }, []);
      
      // --- Ledger Consolidation Logic ---
      const logChange = (change) => {
        setSessionChanges(prev => {
            if (change.type !== 'UPDATE_STOCK' && change.type !== 'ADJUST_PACK_STOCK') {
                return [...prev, change];
            }
            const existingChangeIndex = prev.findIndex(c => c.type === change.type && c.targetId === change.targetId);
            if (existingChangeIndex > -1) {
                const updatedChanges = [...prev];
                const existing = updatedChanges[existingChangeIndex];
                existing.totalChange += change.totalChange;
                existing.details = `${change.type === 'UPDATE_STOCK' ? 'Stock' : 'Units'} changed from ${existing.initialStock} to ${existing.initialStock + existing.totalChange} (${existing.totalChange > 0 ? '+' : ''}${existing.totalChange})`;
                return updatedChanges;
            } else {
                return [...prev, change];
            }
        });
      };

      // --- Operation Wrapper ---
      const withLedger = (operationFn) => async (...args) => {
        if (!isSessionActive) {
            setShowStartSessionPrompt(true);
            return;
        }
        const changeDescription = await operationFn(...args, true);
        if (changeDescription) logChange(changeDescription);
      };

      // --- Core Firestore Operations ---
      const addItem = async (isCapturing) => {
        if (!newItemName.trim()) return;
        const name = newItemName.trim(); const stock = parseInt(newItemStock) || 0;
        const docRef = await db.collection('items').add({ name, stock, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
        setNewItemName(''); setNewItemStock('');
        if (isCapturing) return { type: 'CREATE_ITEM', name, targetId: docRef.id, details: `Created with stock of ${stock}` };
      };

      const updateItemName = async (id, newName, isCapturing) => {
        const item = items.find(i => i.id === id); if (!item || !newName.trim()) return;
        const oldName = item.name;
        await db.collection('items').doc(id).update({ name: newName.trim() }); setEditing({ id: null, text: '' });
        if (isCapturing) return { type: 'UPDATE_ITEM', name: newName.trim(), targetId: id, details: `Name changed from '${oldName}' to '${newName.trim()}'` };
      };
      
      const updateStock = async (id, change, isCapturing) => {
        const item = items.find(i => i.id === id); if(!item) return;
        await db.collection('items').doc(id).update({ stock: firebase.firestore.FieldValue.increment(change) });
        setAdjustmentItemId(null); setAdjustmentValue('');
        if(isCapturing) return { type: 'UPDATE_STOCK', name: item.name, targetId: id, initialStock: item.stock, totalChange: change, details: `Stock changed from ${item.stock} to ${item.stock + change} (${change > 0 ? '+' : ''}${change})` };
      };

      const deleteItem = async (id, isCapturing) => {
        if (!confirm('This may affect packs. Continue?')) return;
        const item = items.find(i => i.id === id); if (!item) return;
        await db.collection('items').doc(id).delete();
        if(isCapturing) return { type: 'DELETE_ITEM', name: item.name, targetId: id, details: 'Item removed from inventory' };
      };

      const addPack = async (isCapturing) => {
          if (!newPackName.trim() || packComponents.length === 0) return;
          const name = newPackName.trim(); const components = packComponents.map(({itemId, quantity}) => ({itemId, quantity}));
          const docRef = await db.collection('packs').add({ name, components, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
          setNewPackName(''); setPackComponents([]); setShowPackForm(false);
          if(isCapturing) return { type: 'CREATE_PACK', name, targetId: docRef.id, details: `Created with ${components.length} component(s)`};
      };

      const updatePackName = async (id, newName, isCapturing) => {
        const pack = packs.find(p => p.id === id); if (!pack || !newName.trim()) return;
        const oldName = pack.name;
        await db.collection('packs').doc(id).update({ name: newName.trim() }); setEditing({id: null, text: ''});
        if (isCapturing) return { type: 'UPDATE_PACK', name: newName.trim(), targetId: id, details: `Name changed from '${oldName}' to '${newName.trim()}'` };
      };
      
      const updatePackStock = async (packId, quantity, isCapturing) => {
        const pack = packs.find(p => p.id === packId); if (!pack) return;
        const batch = db.batch();
        pack.components.forEach(c => {
            const itemDocRef = db.collection('items').doc(c.itemId);
            batch.update(itemDocRef, { stock: firebase.firestore.FieldValue.increment(-c.quantity * quantity) });
        });
        await batch.commit(); setAdjustmentPackId(null); setAdjustmentValue('');
        const initialAvailability = calculatePackAvailability(pack);
        if(isCapturing) return { type: 'ADJUST_PACK_STOCK', name: pack.name, targetId: packId, initialStock: initialAvailability, totalChange: quantity, details: `Units changed by ${quantity > 0 ? '+' : ''}${quantity}`};
      };

      const deletePack = async (id, isCapturing) => {
        if (!confirm('Are you sure?')) return;
        const pack = packs.find(p => p.id === id); if (!pack) return;
        await db.collection('packs').doc(id).delete();
        if(isCapturing) return { type: 'DELETE_PACK', name: pack.name, targetId: id, details: 'Pack removed' };
      };

      // --- Session Management & Calculations ---
      const handleStartSession = () => { setIsSessionActive(true); setSessionChanges([]); };
      const handleEndSession = async () => {
        if (sessionChanges.length === 0) { setIsSessionActive(false); return; }
        await db.collection('ledger').add({ sessionEndedAt: firebase.firestore.FieldValue.serverTimestamp(), note: sessionNote || "No summary provided.", changes: sessionChanges });
        setIsSessionActive(false); setSessionChanges([]); setSessionNote(""); setIsSaveSessionModalVisible(false);
      };
      
      const calculatePackAvailability = useMemo(() => (pack) => {
        if (!pack?.components || pack.components.length === 0) return 0;
        return Math.min(...pack.components.map(c => {
          const item = items.find(i => i.id === c.itemId);
          return (item && c.quantity > 0) ? Math.floor(item.stock / c.quantity) : 0;
        }));
      }, [items]);

      const dashboardMetrics = useMemo(() => ({
        totalStockValue: items.reduce((sum, i) => sum + (i.stock || 0), 0),
        totalAvailablePacks: packs.reduce((sum, p) => sum + calculatePackAvailability(p), 0),
        lowStockItems: items.filter(i => i.stock < 5).length,
      }), [items, packs, calculatePackAvailability]);

      const filteredItems = useMemo(() => items.filter(i => i.name.toLowerCase().includes(searchQuery.toLowerCase())), [items, searchQuery]);
      const filteredPacks = useMemo(() => packs.filter(p => p.name.toLowerCase().includes(searchQuery.toLowerCase()) || (p.components && p.components.some(c => items.find(i => i.id === c.itemId)?.name.toLowerCase().includes(searchQuery.toLowerCase())))), [packs, items, searchQuery]);

      // --- Render Logic ---
      if (loading) return <div className="min-h-screen flex items-center justify-center"><div className="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500"></div></div>;

      return (
        <div className="min-h-screen bg-gray-50 p-4 font-sans">
          {/* Modals */}
          {isLedgerVisible && <div className="modal-backdrop" onClick={() => setIsLedgerVisible(false)}><div className="modal-content bg-white rounded-lg shadow-xl w-11/12 max-w-4xl h-3/4 flex flex-col" onClick={e => e.stopPropagation()}><div className="p-4 border-b"><h2 className="text-xl font-bold">Operations Ledger</h2></div><div className="p-4 flex-grow overflow-y-auto bg-gray-50">{ledger.length === 0 ? <p>No ledger entries yet.</p> : <ul className="space-y-4">{ledger.map(entry => (<li key={entry.id} className="bg-white p-4 rounded-lg shadow"><div className="flex justify-between items-center mb-2"><p className="font-bold text-lg">{entry.note}</p><p className="text-sm text-gray-500">{entry.sessionEndedAt ? new Date(entry.sessionEndedAt.toDate()).toLocaleString() : ''}</p></div><ul className="space-y-1 pl-4 border-l-2">{entry.changes.map((change, index) => (<li key={index} className="text-sm text-gray-700"><span className="font-semibold">{change.name}</span>: {change.details}</li>))}</ul></li>))}</ul>}</div><div className="p-4 border-t text-right"><button onClick={() => setIsLedgerVisible(false)} className="px-4 py-2 bg-gray-200 rounded-md">Close</button></div></div></div>}
          {isSaveSessionModalVisible && <div className="modal-backdrop"><div className="modal-content bg-white rounded-lg shadow-xl w-11/12 max-w-lg"><div className="p-6"><h2 className="text-xl font-bold mb-4">End Session</h2><p className="mb-4">You've made {sessionChanges.length} change(s). Add an optional note to summarize.</p><textarea value={sessionNote} onChange={e => setSessionNote(e.target.value)} placeholder="e.g., Weekly stock intake..." className="w-full p-2 border rounded-md" rows="3"></textarea></div><div className="px-6 py-4 bg-gray-50 flex justify-end gap-3"><button onClick={() => setIsSaveSessionModalVisible(false)} className="px-4 py-2 bg-gray-200 rounded-md">Cancel</button><button onClick={handleEndSession} className="px-4 py-2 bg-blue-600 text-white rounded-md">Save to Ledger</button></div></div></div>}
          {showStartSessionPrompt && <div className="modal-backdrop"><div className="modal-content bg-white rounded-lg shadow-xl w-11/12 max-w-sm text-center p-6"><h2 className="text-xl font-bold mb-4">Session Required</h2><p className="mb-6">Please start a session before making any changes to the inventory.</p><button onClick={() => setShowStartSessionPrompt(false)} className="w-full px-4 py-2 bg-blue-600 text-white rounded-md">OK</button></div></div>}
          
          <div className="max-w-6xl mx-auto">
            {isSessionActive && <div className="sticky-banner bg-blue-600 text-white rounded-lg p-4 mb-6 flex justify-between items-center shadow-lg"><div><h3 className="font-bold text-lg">Session in Progress</h3><p>{sessionChanges.length} unique change(s) recorded.</p></div><button onClick={() => setIsSaveSessionModalVisible(true)} className="bg-white text-blue-600 font-bold px-4 py-2 rounded-md hover:bg-blue-100">End & Save Session</button></div>}
            
            <div className="bg-white rounded-lg shadow-md p-6 mb-6"><div className="flex flex-wrap justify-between items-center gap-4"><div><h1 className="text-2xl font-bold text-gray-800">Stock Inventory Manager</h1></div><div className="flex gap-2">{!isSessionActive && <button onClick={handleStartSession} className="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">Start Session</button>}<button onClick={() => setIsLedgerVisible(true)} className="px-4 py-2 bg-gray-600 text-white rounded-md hover:bg-gray-700">View Ledger</button></div></div></div>
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6"><div className="bento-box bg-blue-50 rounded-xl p-4 shadow-sm border"><h3 className="text-sm font-medium text-blue-800 mb-1">Total Products</h3><p className="text-2xl font-bold text-blue-900">{items.length}</p></div><div className="bento-box bg-green-50 rounded-xl p-4 shadow-sm border"><h3 className="text-sm font-medium text-green-800 mb-1">Total Stock</h3><p className="text-2xl font-bold text-green-900">{dashboardMetrics.totalStockValue}</p></div><div className="bento-box bg-purple-50 rounded-xl p-4 shadow-sm border"><h3 className="text-sm font-medium text-purple-800 mb-1">Available Packs</h3><p className="text-2xl font-bold text-purple-900">{dashboardMetrics.totalAvailablePacks}</p></div><div className={`bento-box rounded-xl p-4 shadow-sm border ${dashboardMetrics.lowStockItems > 0 ? 'bg-amber-50' : 'bg-emerald-50'}`}><h3 className="text-sm font-medium mb-1">{dashboardMetrics.lowStockItems > 0 ? 'Low Stock Items' : 'Stock Levels Good'}</h3><p className={`text-2xl font-bold ${dashboardMetrics.lowStockItems > 0 ? 'text-amber-800' : 'text-emerald-800'}`}>{dashboardMetrics.lowStockItems > 0 ? `${dashboardMetrics.lowStockItems} items` : 'All good'}</p></div></div>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6"><div className="bg-white rounded-lg shadow-sm p-6"><h2 className="text-lg font-semibold mb-4">Add New Product</h2><div className="flex flex-col sm:flex-row gap-3"><input type="text" placeholder="Product name" value={newItemName} onChange={e=>setNewItemName(e.target.value)} className="flex-1 px-3 py-2 border rounded-md" /><input type="number" placeholder="Initial stock" value={newItemStock} onChange={e=>setNewItemStock(e.target.value)} className="w-full sm:w-32 px-3 py-2 border rounded-md" /><button onClick={()=>withLedger(addItem)()} disabled={!newItemName.trim() && !isSessionActive} className="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 disabled:bg-gray-300">Add</button></div></div><div className="bg-white rounded-lg shadow-sm p-6"><h2 className="text-lg font-semibold mb-4">Search Inventory</h2><input type="search" placeholder="Search..." value={searchQuery} onChange={e=>setSearchQuery(e.target.value)} className="w-full px-3 py-2 border rounded-md"/></div></div>
            
            <div className="mb-8">
              <div className="flex justify-between items-center mb-4"><h2 className="text-xl font-semibold">Packs ({filteredPacks.length})</h2><button onClick={()=>withLedger(()=>setShowPackForm(!showPackForm))()} className="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700">{showPackForm ? 'Cancel' : 'Create New Pack'}</button></div>
              {showPackForm && <div className="mb-6 p-4 bg-gray-100 rounded-lg border"><h3 className="font-medium mb-3">New Pack Details</h3><div className="mb-4"><label className="block text-sm font-medium text-gray-700 mb-1">Pack Name</label><input type="text" value={newPackName} onChange={e=>setNewPackName(e.target.value)} className="w-full p-2 border rounded-md"/></div><div className="mb-4"><label className="block text-sm font-medium">Add Components</label><div className="flex flex-wrap gap-2 mt-1 max-h-40 overflow-y-auto p-2 bg-white border rounded-md">{items.map(item=>(<button key={item.id} onClick={()=>{const existing=packComponents.find(c=>c.itemId===item.id);if(existing){setPackComponents(packComponents.map(c=>c.itemId===item.id?{...c,quantity:c.quantity+1}:c))}else{setPackComponents([...packComponents,{itemId:item.id,quantity:1,name:item.name}])}}} className="px-3 py-1 text-xs bg-green-100 text-green-800 rounded-full hover:bg-green-200">{item.name}</button>))}</div></div><div className="mb-4"><label className="block text-sm font-medium">Pack Contents</label>{packComponents.length === 0 ? <p className="text-sm text-gray-500 mt-1">No components.</p> : <ul className="space-y-2 mt-1">{packComponents.map(c=>(<li key={c.itemId} className="flex items-center justify-between p-2 bg-white rounded-md"><span className="text-sm">{c.name}</span><div className="flex items-center gap-2"><input type="number" min="1" value={c.quantity} onChange={e=>setPackComponents(packComponents.map(pc=>pc.itemId===c.itemId?{...pc,quantity:parseInt(e.target.value)||1}:pc))} className="w-16 p-1 border rounded-md text-center"/><button onClick={()=>setPackComponents(packComponents.filter(pc=>pc.itemId!==c.itemId))} className="text-xs text-red-600 hover:text-red-800">Remove</button></div></li>))}</ul>}</div><div className="flex justify-end"><button onClick={()=>withLedger(addPack)()} disabled={!newPackName.trim()||packComponents.length===0} className="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 disabled:bg-gray-300">Create</button></div></div>}
              {filteredPacks.length===0&&!showPackForm?<div className="bg-white rounded-lg shadow-sm p-6 text-center text-gray-500">No packs found.</div>:<div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">{filteredPacks.map(pack=>{const available=calculatePackAvailability(pack);return(<div key={pack.id} className="bg-white rounded-lg shadow-sm border p-4 card-transition flex flex-col justify-between"><div><div className="flex justify-between items-start mb-2">{editing.id===pack.id?<input type="text" value={editing.text} onChange={e=>setEditing({...editing,text:e.target.value})} className="text-lg font-medium border-b-2 w-full" autoFocus onKeyDown={e=>e.key==='Enter'&&withLedger(updatePackName)(pack.id,editing.text)}/>:<h3 className="text-lg font-medium">{pack.name}</h3>}<span className={`flex-shrink-0 ml-2 px-2 py-1 rounded-full text-xs font-medium ${available>5?'bg-green-100 text-green-800':'bg-red-100 text-red-800'}`}>{available} available</span></div><div className="mb-4"><h4 className="text-sm font-medium text-gray-500 mb-1">Components:</h4><ul className="space-y-1">{pack.components?.map((c,i)=><li key={i} className="text-sm text-gray-600">{c.quantity} &times; {items.find(item=>item.id===c.itemId)?.name||'N/A'}</li>)}</ul></div></div><div className="flex flex-col space-y-2 mt-auto">{editing.id===pack.id?<div className="flex gap-2"><button onClick={()=>withLedger(updatePackName)(pack.id,editing.text)} className="w-full px-2 py-1 text-xs bg-blue-600 text-white rounded">Save</button><button onClick={()=>setEditing({id:null,text:''})} className="w-full px-2 py-1 text-xs bg-gray-200 rounded">Cancel</button></div>:<div className="grid grid-cols-5 gap-2 text-center"><button onClick={()=>withLedger(updatePackStock)(pack.id,-1)} className="p-1 text-xs bg-green-100 rounded" title="Add 1 pack to stock (returns components)">Add</button><button onClick={()=>withLedger(updatePackStock)(pack.id,1)} disabled={available<=0} className="p-1 text-xs bg-red-100 rounded disabled:opacity-50" title="Subtract 1 pack (consumes components)">Sub</button><button onClick={()=>setAdjustmentPackId(pack.id===adjustmentPackId?null:pack.id)} className="p-1 text-xs bg-blue-100 rounded">Adj</button><button onClick={()=>withLedger(()=>setEditing({id:pack.id,text:pack.name}))()} className="p-1 text-xs bg-yellow-100 rounded">Edit</button><button onClick={()=>withLedger(deletePack)(pack.id)} className="p-1 text-xs bg-gray-200 rounded">Del</button></div>}{adjustmentPackId===pack.id&&<div className="flex items-center space-x-2"><input type="number" min="1" value={adjustmentValue} onChange={e=>setAdjustmentValue(e.target.value)} className="flex-1 p-1 text-xs border rounded"/><button onClick={()=>withLedger(updatePackStock)(pack.id,Math.abs(parseInt(adjustmentValue))||0)} className="px-2 py-1 text-xs bg-red-600 text-white rounded">Sub</button><button onClick={()=>withLedger(updatePackStock)(pack.id,-Math.abs(parseInt(adjustmentValue))||0)} className="px-2 py-1 text-xs bg-green-600 text-white rounded">Add</button></div>}</div></div>)})}</div>}
            </div>

            <div className="mb-6">
              <h2 className="text-xl font-semibold mb-4">Products ({filteredItems.length})</h2>
              {filteredItems.length===0?<div className="bg-white rounded-lg shadow-sm p-6 text-center text-gray-500">No products found.</div>:<div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">{filteredItems.map(item=>(<div key={item.id} className="bg-white rounded-lg shadow-sm border p-4 card-transition flex flex-col justify-between"><div><div className="flex justify-between items-start">{editing.id===item.id?<input type="text" value={editing.text} onChange={e=>setEditing({...editing,text:e.target.value})} className="text-lg font-medium border-b-2 w-full" autoFocus onKeyDown={e=>e.key==='Enter'&&withLedger(updateItemName)(item.id,editing.text)}/>:<h3 className="text-lg font-medium">{item.name}</h3>}<span className={`flex-shrink-0 ml-2 text-xl font-bold ${item.stock<5?'text-amber-600':'text-gray-800'}`}>{item.stock}</span></div></div><div className="mt-4 flex flex-col space-y-2">{editing.id===item.id?<div className="flex gap-2"><button onClick={()=>withLedger(updateItemName)(item.id,editing.text)} className="w-full px-2 py-1 text-xs bg-blue-600 text-white rounded">Save</button><button onClick={()=>setEditing({id:null,text:''})} className="w-full px-2 py-1 text-xs bg-gray-200 rounded">Cancel</button></div>:<div className="grid grid-cols-5 gap-2 text-center"><button onClick={()=>withLedger(updateStock)(item.id,1)} className="p-1 text-xs bg-green-100 rounded">+1</button><button onClick={()=>withLedger(updateStock)(item.id,-1)} disabled={item.stock<=0} className="p-1 text-xs bg-red-100 rounded disabled:opacity-50">-1</button><button onClick={()=>setAdjustmentItemId(item.id===adjustmentItemId?null:item.id)} className="p-1 text-xs bg-blue-100 rounded">Adj</button><button onClick={()=>withLedger(()=>setEditing({id:item.id,text:item.name}))()} className="p-1 text-xs bg-yellow-100 rounded">Edit</button><button onClick={()=>withLedger(deleteItem)(item.id)} className="p-1 text-xs bg-gray-200 rounded">Del</button></div>}{adjustmentItemId===item.id&&<div className="flex items-center space-x-2"><input type="number" min="1" value={adjustmentValue} onChange={e=>setAdjustmentValue(e.target.value)} className="flex-1 p-1 text-xs border rounded"/><button onClick={()=>withLedger(updateStock)(item.id,Math.abs(parseInt(adjustmentValue))||0)} className="px-2 py-1 text-xs bg-green-600 text-white rounded">Add</button><button onClick={()=>withLedger(updateStock)(item.id,-Math.abs(parseInt(adjustmentValue))||0)} className="px-2 py-1 text-xs bg-red-600 text-white rounded">Sub</button></div>}</div></div>))}</div>}
            </div>
          </div>
        </div>
      );
    }
    
    // --- App Wrapper for Authentication ---
    function App() {
        const [isAuthenticated, setIsAuthenticated] = useState(false);

        if (!isAuthenticated) {
            return <LoginScreen onLoginSuccess={() => setIsAuthenticated(true)} />;
        }

        return <StockInventoryApp />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
